<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 64" fill="none">
  <!-- Monogram Icon: The Zero Circle with internal architectural crosshairs -->
  <g class="zero-symbol" transform="translate(4, 4)">
    <circle cx="28" cy="28" r="26" stroke="currentColor" stroke-width="2.5" stroke-dasharray="140 10"/>
    <circle cx="28" cy="28" r="14" stroke="currentColor" stroke-width="1.5" opacity="0.6"/>
    <circle cx="28" cy="28" r="3.5" fill="currentColor"/>
    <!-- Cardinal precision tick marks -->
    <line x1="28" y1="0" x2="28" y2="6" stroke="currentColor" stroke-width="2"/>
    <line x1="28" y1="50" x2="28" y2="56" stroke="currentColor" stroke-width="2"/>
    <line x1="0" y1="28" x2="6" y2="28" stroke="currentColor" stroke-width="2"/>
    <line x1="50" y1="28" x2="56" y2="28" stroke="currentColor" stroke-width="2"/>
  </g>
  <!-- Brand Typography -->
  <text x="74" y="36" font-family="'Cinzel', 'Plus Jakarta Sans', -apple-system, sans-serif" font-size="24" font-weight="800" letter-spacing="6" fill="currentColor">ZERO</text>
  <text x="76" y="52" font-family="'Inter', sans-serif" font-size="10" font-weight="600" letter-spacing="7" fill="currentColor" opacity="0.65">DESIGN STUDIO</text>
</svg>

